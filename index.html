<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e8">
  <title>SplitSmart — Group Expense Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="dashboard" aria-label="SplitSmart home">
        <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 17.5 13.2 24 26 9"/><path d="M16 5.5v5M5 13h5"/></svg></span>
        <span>split<span class="brand-light">smart</span><small>SHARE BETTER, LIVE LIGHTER</small></span>
      </a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-link active" data-page="dashboard"><span class="nav-icon">▦</span>Dashboard</button>
        <button class="nav-link" data-page="groups"><span class="nav-icon">◫</span>My Groups<span class="nav-count" id="group-count">0</span></button>
        <button class="nav-link" data-page="expenses"><span class="nav-icon">↗</span>All Expenses</button>
        <button class="nav-link" data-page="balances"><span class="nav-icon">⇄</span>Balances</button>
        <button class="nav-link" data-page="settlements"><span class="nav-icon">✓</span>Settlements</button>
        <button class="nav-link" data-page="analytics"><span class="nav-icon">◒</span>Analytics</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-tip">
          <div class="tip-icon">✦</div>
          <strong>Good things are shared.</strong>
          <p>Keep your group in sync and the good times rolling.</p>
          <button data-page="groups">Explore groups <span>↗</span></button>
        </div>
        <button class="nav-link settings-link" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
        <button class="profile-mini" data-page="settings">
          <span class="avatar avatar-user">P</span><span class="profile-text"><strong id="sidebar-name">Pravesh</strong><small>Personal workspace</small></span><span class="profile-dots">···</span>
        </button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu icon-button" id="mobile-menu" aria-label="Open navigation">☰</button>
        <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Dashboard</strong></div>
        <div class="topbar-actions">
          <span class="date-label" id="today-label"></span>
          <button class="icon-button notification-button" id="notifications-button" aria-label="Notifications">♧<i id="notification-dot"></i></button>
          <button class="top-avatar" data-page="settings" aria-label="Open profile">P</button>
        </div>
      </header>
      <section id="view" class="view-content" aria-live="polite"></section>
    </main>
  </div>
  <div class="sidebar-scrim" id="sidebar-scrim"></div>
  <div id="modal-root"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
